<text x="711" y="377" class="tag">Фрагмент 1</text>
<text x="1026" y="377" class="tag" fill="#995b1e">Фрагмент 2</text>
<text x="665" y="396" class="note">Оба участка происходят из исходного изображения</text>
<rect x="22" y="436" width="1236" height="56" rx="10" fill="#eef4f8"/>
<text x="43" y="460" class="tag">Известно:</text>
<text x="145" y="460" class="note">какое содержимое перемещено и как изменились координаты</text>
<text x="43" y="482" class="tag">Не установлено автоматически:</text>
<text x="337" y="482" class="note">что каждый фрагмент является отдельным автомобилем</text>
