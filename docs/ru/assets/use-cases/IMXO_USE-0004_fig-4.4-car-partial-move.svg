    <path d="M208 86 L208 124" stroke="#285b83" stroke-width="2"/>
    <path d="M217 91 L233 91" stroke="#f1f5fa" stroke-width="4" stroke-linecap="round"/>
    <path d="M45 93 L67 93" stroke="#fff5c2" stroke-width="6" stroke-linecap="round"/>
    <path d="M331 95 L341 95" stroke="#fff5c2" stroke-width="7" stroke-linecap="round"/>
    <circle cx="91" cy="134" r="25" fill="#263647" stroke="#627e8d" stroke-width="4"/>
    <circle cx="91" cy="134" r="11" fill="#c4d0d7"/>
    <circle cx="286" cy="134" r="25" fill="#263647" stroke="#627e8d" stroke-width="4"/>
    <circle cx="286" cy="134" r="11" fill="#c4d0d7"/>
  </g>
</defs>
<rect width="1280" height="510" rx="16" fill="#ffffff"/>
