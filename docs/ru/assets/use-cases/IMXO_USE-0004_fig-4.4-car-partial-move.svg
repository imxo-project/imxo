<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" width="1280" height="510" role="img" aria-labelledby="title desc">
<title id="title">Рис. 4.4 — Частичное перемещение автомобиля: исходная область и два фрагмента</title>
<desc id="desc">Слева один распознанный автомобиль с линией разреза. Справа задний и передний фрагменты изображения разнесены по горизонтали. Прежняя метка автомобиль не переносится на фрагменты автоматически.</desc>
<defs>
  <style>
    .h{font:700 24px Arial, 'DejaVu Sans', sans-serif; fill:#162838}
    .s{font:17px Arial, 'DejaVu Sans', sans-serif; fill:#40576a}
    .tag{font:700 17px Arial, 'DejaVu Sans', sans-serif; fill:#195c81}
    .note{font:16px Arial, 'DejaVu Sans', sans-serif; fill:#51697b}
  </style>
  <clipPath id="rear"><rect x="0" y="0" width="202" height="180"/></clipPath>
  <clipPath id="front"><rect x="202" y="0" width="178" height="180"/></clipPath>
  <g id="car">
    <path d="M22 110 L38 88 Q45 81 74 81 L112 79 L149 39 Q154 33 171 33 L241 33 Q254 33 262 46 L294 80 L329 84 Q343 88 346 101 L349 124 Q349 134 340 134 L27 134 Q17 134 17 124Z" fill="#4d94cb" stroke="#285b83" stroke-width="3" stroke-linejoin="round"/>
    <path d="M152 75 L178 43 L239 43 L263 77Z" fill="#d4ebf6" stroke="#285b83" stroke-width="2"/>
