<rect x="636" y="18" width="622" height="401" rx="12" fill="#f5f8fb" stroke="#d7e0e9" stroke-width="2"/>
<text x="51" y="62" class="h">До редактирования</text>
<text x="665" y="62" class="h">После частичного перемещения</text>
<text x="51" y="91" class="s">Исходное распознавание: «автомобиль»</text>
<text x="665" y="91" class="s">Выделенная часть перенесена вправо</text>
<g transform="translate(132 164)"><use href="#car" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#car"/></g>
<rect x="137" y="182" width="365" height="153" rx="7" fill="none" stroke="#1889bb" stroke-width="2.5" stroke-dasharray="8 5"/>
<path d="M334 163 V349" stroke="#cf8539" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="343" y="355" font-size="15" font-family="Arial,DejaVu Sans,sans-serif" fill="#a36625">Граница выделения</text>
<text x="51" y="391" class="tag">Одна область и исходная аннотация</text>
<g transform="translate(683 164)" clip-path="url(#rear)"><use href="#car" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#car"/></g>
<g transform="translate(812 164)" clip-path="url(#front)"><use href="#car" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#car"/></g>
<rect x="677" y="183" width="208" height="153" rx="7" fill="none" stroke="#1889bb" stroke-width="2.5" stroke-dasharray="7 5"/>
