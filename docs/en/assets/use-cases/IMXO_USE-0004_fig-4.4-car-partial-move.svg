<text x="43" y="460" class="tag">Known:</text>
<text x="145" y="460" class="note">which content moved and how the coordinates changed</text>
<text x="43" y="482" class="tag">Not established automatically:</text>
<text x="337" y="482" class="note">that each fragment is a separate car</text>
